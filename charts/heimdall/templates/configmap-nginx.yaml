{{- $nginx := .Values.frontend.nginx }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "heimdall.frontend.fullname" . }}
  labels:
    {{- include "heimdall.componentLabels" (dict "ctx" . "component" "frontend") | nindent 4 }}
data:
  # Kubernetes variant of frontend/nginx.conf (keep both in sync): unprivileged port and the
  # release's backend Service as upstream.
  default.conf: |
    server {
        listen {{ .Values.frontend.containerPort }};
        {{- if $nginx.listenIPv6 }}
        listen [::]:{{ .Values.frontend.containerPort }};
        {{- end }}
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types
            text/plain text/css text/javascript application/javascript
            application/json application/manifest+json image/svg+xml;

        # API -> Go backend. No URI on proxy_pass: the original path and query
        # string are forwarded unchanged.
        location /api/ {
            proxy_pass http://{{ include "heimdall.backend.fullname" . }}:{{ .Values.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout {{ $nginx.proxyConnectTimeout }};
            proxy_send_timeout    {{ $nginx.proxySendTimeout }};
            proxy_read_timeout    {{ $nginx.proxyReadTimeout }};
            add_header Cache-Control "no-store" always;
        }

        # Hashed build output: safe to cache forever.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # The shell must always be revalidated so new deployments are picked up.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # SPA fallback: unknown paths serve index.html (client-side routes).
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
        {{- with $nginx.extraServerConfig }}

        {{- . | nindent 8 }}
        {{- end }}
    }
